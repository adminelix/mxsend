[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = [
    # RUSTSEC-2026-0173: proc-macro-error2 is unmaintained.
    # Advisory: https://rustsec.org/advisories/RUSTSEC-2026-0173.html
    # Upstream issue: https://github.com/matrix-org/matrix-rust-sdk/issues/6654
    #
    # Two dependency paths pull it in:
    #   1. matrix-sdk / matrix-sdk-crypto → aquamarine v0.6.0 (latest)
    #   2. vodozemac v0.10.0 (latest) → matrix-pickle → matrix-pickle-derive v0.2.2
    #
    # Both aquamarine and vodozemac/matrix-pickle-derive need to either drop or
    # replace proc-macro-error2 (e.g. with proc-macro-error3). Until then this
    # advisory cannot be resolved upstream. Revisit on matrix-sdk or vodozemac
    # bump.
    "RUSTSEC-2026-0173",
    # RUSTSEC-2026-0247: bitmaps is unmaintained (repository archived 2026-05-03).
    # Advisory: https://rustsec.org/advisories/RUSTSEC-2026-0247.html
    #
    # Dependency path:
    #   matrix-sdk v0.18.0 (latest) -> imbl v6.1.0 -> bitmaps v3.2.1
    #
    # No upstream fix: imbl depends on bitmaps in both v6 and v7, and the
    # bitmaps repository is archived. Revisit if imbl replaces bitmaps
    # (e.g. with fixedbitset) or matrix-sdk drops the imbl dependency.
    "RUSTSEC-2026-0247",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "OpenSSL",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
