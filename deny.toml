[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
# Unmaintained advisories are informational, not vulnerabilities, and cargo-deny
# has no warn level for them: the scope selects which crates fail the check.
# Dependencies are dictated by matrix-sdk, so we cannot act on their advisories
# (e.g. RUSTSEC-2026-0319 for anymap2, still required by matrix-sdk 0.19.1 with
# no patched release). Only fail for our own crates; cargo audit, which runs in
# the same job, still reports unmaintained dependencies as warnings.
unmaintained = "workspace"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "OpenSSL",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
