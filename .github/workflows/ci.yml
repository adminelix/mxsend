name: CI

# Pipeline triggers:
#
#   PR → main         check → test → security
#   Push → main        check → test → security → build
#   Tag v*             check → test → security → build → release (always pre-release)
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo check --all-targets --all-features
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/security-audit

  build:
    if: github.ref_type == 'tag' || github.ref_name == 'main'
    needs: [check, test, security]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-26
          - target: aarch64-apple-darwin
            os: macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        if: contains(matrix.target, 'linux-musl')
        with:
          version: 0.15.2
      - uses: taiki-e/install-action@v2.87.0
        if: contains(matrix.target, 'linux-musl')
        with:
          tool: cargo-zigbuild
      - name: Install cross-compilers (Windows)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get install -y mingw-w64
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc" >> $GITHUB_ENV
      - name: Build release binary (musl)
        if: contains(matrix.target, 'linux-musl')
        run: cargo zigbuild --release --target ${{ matrix.target }}
      - name: Build release binary
        if: "!contains(matrix.target, 'linux-musl')"
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package release artifact
        shell: bash
        run: |
          mkdir -p releases
          if [[ "${{ matrix.target }}" == *-windows-* ]]; then
            cp "target/${{ matrix.target }}/release/mxsend.exe" "releases/mxsend-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/mxsend" "releases/mxsend-${{ matrix.target }}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: mxsend-${{ matrix.target }}
          path: releases/

  release:
    needs: [build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: mxsend-*
          path: releases/
          merge-multiple: true
      - uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header --tag ${{ github.ref_name }}
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: releases/*
          body_path: RELEASE_NOTES.md
          prerelease: true
